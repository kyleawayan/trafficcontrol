# Builds the Fabric port jar on every push to the working branch.
name: build

on:
  push:
    branches:
      - claude/traffic-control-fabric-rewrite-rcf0S
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew
        working-directory: port

      - name: Build
        run: ./gradlew build --stacktrace
        working-directory: port

      - name: Resolve short SHA
        id: sha
        run: echo "short=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trafficcontrol-${{ steps.sha.outputs.short }}
          path: port/build/libs/*.jar
